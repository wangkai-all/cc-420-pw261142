<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen Kits — Data Quality &amp; Blast Radius</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <div>
      <h1>Lumen Kits <span class="muted">/ data quality</span></h1>
      <p class="sub" id="brand-sub">loading…</p>
    </div>
  </div>
  <div class="controls">
    <label class="field">
      <span>Run</span>
      <select id="run-select"></select>
    </label>
    <label class="field">
      <span>Rule set</span>
      <select id="ruleset-select"></select>
    </label>
    <button class="btn ghost" id="theme-toggle" title="Toggle light/dark">◐</button>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button class="tab active" data-view="overview" role="tab">Scorecard</button>
  <button class="tab" data-view="reports" role="tab">Report impact</button>
  <button class="tab" data-view="rules" role="tab">Rules &amp; history</button>
  <button class="tab" data-view="runs" role="tab">Runs &amp; recovery</button>
  <button class="tab" data-view="lineage" role="tab">Lineage</button>
</nav>

<main id="view" aria-live="polite"></main>

<div id="drawer" class="drawer" hidden>
  <div class="drawer-scrim" data-close></div>
  <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <header class="drawer-head">
      <div>
        <p class="eyebrow" id="drawer-kicker"></p>
        <h2 id="drawer-title"></h2>
      </div>
      <button class="btn ghost" data-close aria-label="Close">✕</button>
    </header>
    <div id="drawer-body" class="drawer-body"></div>
  </aside>
</div>

<div id="toast" class="toast" hidden></div>
<script src="/app.js"></script>
</body>
</html>
